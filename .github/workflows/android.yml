# The Zendr phone app: unit tests, a release build, and the whole app on an Android emulator
# against a fake Zendr (app/src/androidTest): pairing, sessions, answering, alerts.
name: Android

on:
  push:
    paths:
      - "mobile/android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "mobile/android/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and builds
        run: ./gradlew --no-daemon testReleaseUnitTest assembleRelease assembleDebug assembleDebugAndroidTest
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: On-device tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          working-directory: mobile/android
          disable-animations: true
          script: ./gradlew --no-daemon connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports
          path: |
            mobile/android/app/build/reports
            mobile/android/app/build/outputs/apk
