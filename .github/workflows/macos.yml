# Zendr for macOS: builds the app and core on Apple silicon (and Intel, best effort), packs
# Zendr-<version>-macos-<arch>.tar.gz with packaging/macos/package.sh, and attaches it to the
# release named by the tag (a pushed v* tag, or the `tag` input when run by hand).
name: macOS build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the builds to (empty: build only)"
        required: false

permissions:
  contents: write

env:
  RUST_TOOLCHAIN: 1.95.0
  ZIG_VERSION: 0.16.0

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, arch: arm64, required: true }
          - { runner: macos-15-intel, arch: x64, required: false }
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ !matrix.required }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            app -> target
            core -> target
          key: ${{ matrix.arch }}
      - name: Build and pack
        run: packaging/macos/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: zendr-macos-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
      - name: Attach to the release
        if: github.ref_type == 'tag' || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: gh release upload "$TAG" dist/*.tar.gz dist/*.sha256 --clobber --repo "$GITHUB_REPOSITORY"
